<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Кинематика · тренажёр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#060A17; --bg2:#0B1226; --panel:#0F1830; --panel2:#131F3D; --line:#1F2C52; --line2:#2C3D6E;
  --text:#E9EEFF; --text2:#A4B1D6; --muted:#6D7BA6;
  --cyan:#3BE3FF; --violet:#8E72FF; --pink:#FF5FD2;
  --ok:#35F2A2; --ok-bg:rgba(53,242,162,.12); --err:#FF5C7A; --err-bg:rgba(255,92,122,.12); --amber:#FFBE55; --amber-bg:rgba(255,190,85,.12);
  --xc:#3BE3FF; --vc:#FF5FD2;
  --f-d:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-b:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-m:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-b);font-size:15.5px;line-height:1.55;min-height:100vh}
.gridbg{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(59,227,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(59,227,255,.045) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse at 50% 0%,#000 30%,transparent 80%)}
.app{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:0 18px 80px}
.topbar{position:sticky;top:0;z-index:20;margin:0 -18px;padding:12px 18px;background:rgba(6,10,23,.8);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font:700 13px var(--f-m);letter-spacing:.12em;text-transform:uppercase;color:var(--text2);text-decoration:none}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan);animation:blink 2.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.tabs{display:flex;gap:4px;margin-left:auto;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;color:var(--text2);font:600 14px var(--f-b);padding:8px 14px;border-radius:9px;cursor:pointer;white-space:nowrap;transition:color .2s,background .2s}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{background:linear-gradient(135deg,var(--cyan),#7FF0FF);color:#04111A;box-shadow:0 0 18px rgba(59,227,255,.35)}
.hero{padding:30px 0 16px;display:grid;gap:10px}
.kicker{font:12px var(--f-m);letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
h1{font-family:var(--f-d);font-weight:800;font-size:clamp(26px,5vw,46px);line-height:1.04;margin:0;letter-spacing:-.02em;text-wrap:balance}
h1 .grad{background:linear-gradient(90deg,var(--cyan),var(--violet) 55%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--text2);max-width:70ch;margin:0}
.view{animation:vin .3s ease-out}
@keyframes vin{from{opacity:0;transform:translateY(6px)}}
.panel{background:linear-gradient(180deg,rgba(19,31,61,.85),rgba(12,20,40,.85));border:1px solid var(--line);border-radius:16px;padding:16px}
.btn{border:1px solid var(--line2);background:var(--panel2);color:var(--text);font:600 14px var(--f-b);padding:9px 15px;border-radius:11px;cursor:pointer;transition:transform .12s,box-shadow .25s,border-color .25s,background .25s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:var(--cyan);box-shadow:0 0 16px rgba(59,227,255,.25)}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(135deg,var(--cyan),#7FF0FF);color:#04111A;border-color:transparent}
.btn.primary:hover{box-shadow:0 0 28px rgba(59,227,255,.55)}
.btn.small{padding:6px 11px;font-size:13px;border-radius:9px}
.btn[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan);background:rgba(59,227,255,.1)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--bg2);color:var(--text2);font:600 13px var(--f-b);border-radius:999px;padding:6px 12px;cursor:pointer;transition:.2s}
.chip:hover{color:var(--text);border-color:var(--cyan)}
.chip[aria-pressed="true"]{color:#04111A;background:var(--cyan);border-color:var(--cyan)}
.story{font-size:16px;line-height:1.6;color:var(--text);margin:12px 0 0;padding:12px 14px;border-left:3px solid var(--violet);background:rgba(142,114,255,.08);border-radius:0 10px 10px 0}
.muted{color:var(--muted)}
.t2{color:var(--text2)}
/* road */
.road{width:100%;display:block;margin-top:14px}
.readout{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.ro{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.ro small{display:block;font:600 11px var(--f-m);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.ro b{font:700 20px var(--f-m)}
.ro.x b{color:var(--xc)}.ro.v b{color:var(--vc)}.ro.s b{color:var(--amber)}
/* graphs */
.graphs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.gcard{position:relative;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px 10px 6px}
.gcard h3{margin:2px 4px 4px;font:700 12px var(--f-m);letter-spacing:.1em;text-transform:uppercase}
.gcard.x h3{color:var(--xc)}.gcard.v h3{color:var(--vc)}
.gcard svg{width:100%;height:auto;display:block;touch-action:none}
.cover{position:absolute;inset:0;border-radius:14px;background:rgba(11,18,38,.94);backdrop-filter:blur(4px);display:grid;place-items:center;text-align:center;padding:16px;cursor:pointer;color:var(--text2);font-size:14px}
.cover[hidden]{display:none}
.cover b{display:block;color:var(--text);font:700 15px var(--f-d);margin-bottom:6px}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.ctrl input[type=range]{flex:1;min-width:160px;accent-color:var(--cyan)}
.tbl{width:100%;border-collapse:collapse;margin-top:12px;font:600 14px var(--f-m);text-align:center}
.tbl th,.tbl td{border:1px solid var(--line);padding:5px 4px}
.tbl th{color:var(--muted);font-size:12px;font-weight:600;background:var(--bg2)}
.tbl td.x{color:var(--xc)}.tbl td.v{color:var(--vc)}
.tbl td.hid{color:var(--line2)}
.tbl td.now{background:rgba(59,227,255,.1)}
.tblwrap{overflow-x:auto}
/* quiz */
.q{font-size:17px;font-weight:600;margin:4px 0 12px;text-wrap:pretty}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line2);background:var(--bg2);color:var(--text);font:500 15px var(--f-b);padding:11px 14px;border-radius:12px;cursor:pointer;transition:.18s;line-height:1.45}
.opt:hover:not([disabled]){border-color:var(--cyan);background:var(--panel2)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.no{border-color:var(--err);background:var(--err-bg)}
.opt[disabled]{cursor:default}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:15px;line-height:1.55}
.fb.ok{background:var(--ok-bg);border:1px solid rgba(53,242,162,.35)}
.fb.no{background:var(--err-bg);border:1px solid rgba(255,92,122,.35)}
.fb b.h{display:block;margin-bottom:4px}
.score{font:600 13px var(--f-m);color:var(--text2)}
.score b{color:var(--ok)}
.qgrid{display:grid;grid-template-columns:1.05fr 1fr;gap:14px;align-items:start}
.ans{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ans input,.fields input{width:120px;background:var(--bg);border:1px solid var(--line2);color:var(--text);border-radius:10px;padding:9px 12px;font:600 16px var(--f-m)}
.ans input:focus,.fields input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(59,227,255,.18)}
.hint{font-size:13px;color:var(--amber);margin:0 0 8px;font-weight:600}
.fields{display:grid;gap:10px;margin-top:12px}
.fields label{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fields label span{min-width:260px}
.fields .mk{font:700 15px var(--f-m)}
.mk.ok{color:var(--ok)}.mk.no{color:var(--err)}
.cust{display:grid;gap:8px;margin-top:10px}
.seg{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.seg input{width:74px;background:var(--bg);border:1px solid var(--line2);color:var(--text);border-radius:8px;padding:6px 8px;font:600 14px var(--f-m)}
.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(40px);opacity:0;background:var(--panel2);border:1px solid var(--line2);padding:10px 16px;border-radius:12px;transition:.3s;z-index:50;font-weight:600}
.toast.show{transform:translateX(-50%);opacity:1}
.accrow{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;margin-top:10px}
.speedos{display:flex;gap:8px}
.speedo{width:190px;height:auto;display:block;background:var(--bg2);border:1px solid var(--line);border-radius:14px}
.note{margin:12px 0 0;padding:12px 14px;border-left:3px solid var(--cyan);background:rgba(59,227,255,.07);border-radius:0 10px 10px 0;font-size:15px;line-height:1.55}
.note[hidden]{display:none}
.pform{display:grid;gap:10px;font:500 14.5px var(--f-m);line-height:1.6}
.fl{display:flex;gap:10px;align-items:flex-start}
.fk{flex:none;width:24px;height:24px;border-radius:7px;background:rgba(142,114,255,.2);color:var(--violet);display:grid;place-items:center;font-weight:700;font-size:13px;margin-top:2px}
.pform b{color:var(--text)}.pform b.ans{color:var(--ok)}
.fallgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;margin-top:12px;align-items:start}
.fallsvg{width:100%;height:auto;display:block}
.sel{background:var(--bg);border:1px solid var(--line2);color:var(--text);border-radius:8px;padding:6px 8px;font:600 14px var(--f-b)}
@media (max-width:820px){.fallgrid{grid-template-columns:1fr}}
@media (max-width:820px){.accrow{grid-template-columns:1fr}.speedos{justify-content:center}.speedo{width:min(46vw,190px)}}
@media (max-width:820px){.graphs,.qgrid{grid-template-columns:1fr}.readout{grid-template-columns:repeat(2,1fr)}.fields label span{min-width:0;flex:1 0 100%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="gridbg"></div>
<div class="app">
 <header class="topbar">
  <a class="brand" href="./" title="В задачник"><i></i>ОГЭ · Графики движения</a>
  <nav class="tabs" id="tabs" role="tablist">
   <button class="tab" data-v="watch" role="tab">Смотри</button>
   <button class="tab" data-v="acc" role="tab">Ускорение</button>
   <button class="tab" data-v="path" role="tab">Путь при разгоне</button>
   <button class="tab" data-v="fall" role="tab">Падение</button>
   <button class="tab" data-v="guess" role="tab">Угадай</button>
   <button class="tab" data-v="build" role="tab">Построй</button>
   <button class="tab" data-v="where" role="tab">Где машина?</button>
  </nav>
 </header>
 <main id="view"></main>
</div>
<div class="toast" id="toast"></div>
<script>
/* ===== Тренажёр «Графики движения» ===== */
const $=s=>document.querySelector(s);
const V=$("#view");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=n=>{const r=Math.round(n*10)/10;return (Number.isInteger(r)?String(r):r.toFixed(1)).replace(".",",").replace("-","−")};
const num=s=>{s=String(s).trim().replace(",",".").replace("−","-").replace(/[^\d.\-]/g,"");return s===""||s==="-"?NaN:parseFloat(s)};
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2000)}

/* ---------- модель движения: старт x0 + участки {d секунд, v м/с} ---------- */
const TT=st=>st.segs.reduce((s,g)=>s+g.d,0);
const A_=g=>g.a||0;
function xAt(st,t){let x=st.x0,a=0;for(const g of st.segs){if(t<=a+g.d){const dt=t-a;return x+g.v*dt+A_(g)*dt*dt/2}x+=g.v*g.d+A_(g)*g.d*g.d/2;a+=g.d}return x}
function vAt(st,t){let a=0;for(const g of st.segs){if(t<a+g.d)return g.v+A_(g)*(t-a);a+=g.d}const l=st.segs[st.segs.length-1];return l?l.v+A_(l)*l.d:0}
function absInt(v0,ac,T){if(T<=0)return 0;const v1=v0+ac*T;if(v0*v1>=0)return Math.abs((v0+v1)/2*T);const tau=-v0/ac;return Math.abs(v0*tau/2)+Math.abs(v1*(T-tau)/2)}
function sAt(st,t){let s=0,a=0;for(const g of st.segs){s+=absInt(g.v,A_(g),Math.max(0,Math.min(g.d,t-a)));a+=g.d}return s}
function xs(st){const p=[st.x0];let x=st.x0;for(const g of st.segs){x+=g.v*g.d+A_(g)*g.d*g.d/2;p.push(x)}return p}
function xExt(st){const T=TT(st);let lo=Infinity,hi=-Infinity;for(let i=0;i<=240;i++){const x=xAt(st,T*i/240);lo=Math.min(lo,x);hi=Math.max(hi,x)}return [lo,hi]}
function vVals(st){const o=[];for(const g of st.segs)o.push(g.v,g.v+A_(g)*g.d);return o}
function segAt(st,i){let a=0;for(let k=0;k<i;k++)a+=st.segs[k].d;return [a,a+st.segs[i].d]}
function merge(segs){const o=[];for(const g of segs){if(g.d<=0)continue;const l=o[o.length-1];if(l&&l.v===g.v&&!A_(l)&&!A_(g))l.d+=g.d;else o.push({d:g.d,v:g.v})}return o}
function unitOf(vals){const all=vals.map(Math.abs).filter(v=>v>0);for(const u of [5,2,1])if(all.every(v=>v%u===0))return u;return 1}
function range(lo,hi,u,maxLines){lo=Math.min(0,lo);hi=Math.max(0,hi);let minor=u;while((hi-lo)/minor>maxLines)minor*=minor===1||minor===10?2:2.5;
 lo=Math.floor(lo/minor+1e-9)*minor;hi=Math.ceil(hi/minor-1e-9)*minor;if(hi-lo<minor*3)hi=lo+minor*4;hi+=minor;if(lo<0)lo-=minor;
 const n=(hi-lo)/minor;let L=1;for(const k of [1,2,4,5,10])if(n/k<=8){L=k;break}
 return {lo,hi,minor,step:minor*L}}
function rangesFor(st,st2){const all=[st].concat(st2?[st2]:[]);let lo=Infinity,hi=-Infinity;const vv=[0],pts=[];for(const s of all){const [a,b]=xExt(s);lo=Math.min(lo,a);hi=Math.max(hi,b);vv.push(...vVals(s));pts.push(...xs(s))}
 const u=st.u||unitOf(pts.concat(vv));return {rx:range(lo,hi,u,16),rv:range(Math.min(...vv),Math.max(...vv),unitOf(vv)||1,12)}}

/* ---------- тексты историй ---------- */
function segText(g){if(g.v===0)return `${g.d} с стоит на месте`;return g.v>0?`${g.d} с едет вперёд со скоростью ${fmt(g.v)} м/с`:`${g.d} с едет назад со скоростью ${fmt(-g.v)} м/с`}
function describe(st,noStart){let s;if(st.segs.length===1){const g=st.segs[0];s=g.v===0?`Все ${g.d} с стоит на месте.`:`Все ${g.d} с едет ${g.v>0?"вперёд":"назад"} со скоростью ${fmt(Math.abs(g.v))} м/с.`}
 else s=st.segs.map((g,i)=>(i===0?"Сначала ":"потом ")+segText(g)).join(", ")+".";return noStart?s:`Старт у столба ${fmt(st.x0)} м. `+s}

/* ---------- генератор историй ---------- */
function genStory(o={}){const u=o.u||pick([1,2,5]);const ks=o.ks||[-2,-1,0,1,2];
 for(let tries=0;tries<400;tries++){const n=rnd(o.minSegs||2,o.maxSegs||3);let segs=[];let tot=0;
  for(let i=0;i<n;i++){const d=rnd(1,o.maxD||4);tot+=d;segs.push({d,v:u*pick(ks)})}
  segs=merge(segs);if(segs.length<(o.minSegs||2)||tot>(o.maxT||8)||tot<3)continue;
  if(segs.every(g=>g.v===0))continue;
  const x0=u*rnd(0,o.maxStart||4);const st={x0,segs,u};const p=xs(st);
  if(Math.min(...p)<0||Math.max(...p)>(o.maxX||(u*16)))continue;
  if(o.needBack&&!segs.some(g=>g.v<0))continue;if(o.needStop&&!segs.some(g=>g.v===0))continue;
  if(o.needMove&&!segs.some(g=>g.v!==0))continue;
  return st}
 return {x0:0,segs:[{d:3,v:u},{d:2,v:0},{d:2,v:-u}],u}}

/* ---------- рисование графика (SVG) ---------- */
const GW=430,GH=280,ML=50,MR=30,MT=30,MB=38;
function gsvg(o){const {kind,st,rng}=o;const T=o.T;const pw=GW-ML-MR,ph=GH-MT-MB;
 const X=t=>ML+t/T*pw,Y=v=>MT+(rng.hi-v)/(rng.hi-rng.lo)*ph;const kc=kind==="x"?"var(--xc)":"var(--vc)";const col=o.col||kc;
 let s=`<svg viewBox="0 0 ${GW} ${GH}" role="img" aria-label="${kind==="x"?"График координаты":"График скорости"}">`;
 for(let t=0;t<=T;t++)s+=`<line x1="${X(t)}" y1="${MT}" x2="${X(t)}" y2="${MT+ph}" stroke="#1F2C52" stroke-width="1"/>`;
 for(let v=rng.lo;v<=rng.hi+1e-9;v+=rng.minor){const major=Math.abs(v/rng.step-Math.round(v/rng.step))<1e-9;s+=`<line x1="${ML}" y1="${Y(v)}" x2="${ML+pw}" y2="${Y(v)}" stroke="${major?"#26375F":"#18223F"}" stroke-width="1"/>`}
 const y0=Y(0);
 s+=`<line x1="${ML}" y1="${y0}" x2="${ML+pw+16}" y2="${y0}" stroke="#A4B1D6" stroke-width="1.6"/><path d="M${ML+pw+18} ${y0} l-8 -4 v8z" fill="#A4B1D6"/>`;
 s+=`<line x1="${ML}" y1="${MT+ph}" x2="${ML}" y2="${MT-16}" stroke="#A4B1D6" stroke-width="1.6"/><path d="M${ML} ${MT-18} l-4 8 h8z" fill="#A4B1D6"/>`;
 const tstep=T>10?2:1;for(let t=tstep;t<=T;t+=tstep)s+=`<text x="${X(t)}" y="${y0+16}" fill="#A4B1D6" font-size="12" font-family="JetBrains Mono,monospace" text-anchor="middle">${t}</text>`;
 s+=`<text x="${ML-7}" y="${y0+16}" fill="#A4B1D6" font-size="12" font-family="JetBrains Mono,monospace" text-anchor="end">0</text>`;
 for(let v=Math.ceil(rng.lo/rng.step)*rng.step;v<=rng.hi+1e-9;v+=rng.step){if(Math.abs(v)<1e-9)continue;s+=`<text x="${ML-7}" y="${Y(v)+4}" fill="#A4B1D6" font-size="12" font-family="JetBrains Mono,monospace" text-anchor="end">${fmt(v)}</text>`}
 s+=`<text x="${ML+pw+20}" y="${y0-8}" fill="#E9EEFF" font-size="14" font-weight="700" font-family="JetBrains Mono,monospace" text-anchor="end">t, с</text>`;
 s+=`<text x="${ML+8}" y="${MT-8}" fill="${kc}" font-size="15" font-weight="700" font-family="JetBrains Mono,monospace">${o.ylab||(kind==="x"?"x, м":"v, м/с")}</text>`;
 const upto=o.upto==null?T:Math.min(o.upto,T);
 if(st&&!o.noCurve){
