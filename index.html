<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100a19">
  <meta name="description" content="Подготовка к ОГЭ и ЕГЭ по физике. Выбери свой экзамен, открой курс или реши пробник.">
  <title>INVARIANT · Подготовка к ОГЭ и ЕГЭ по физике</title>
  <script>
    (() => {
      function forwardOldLink() {
        const {search, hash} = location;
        const query = new URLSearchParams(search);
        const fragment = new URLSearchParams(hash.slice(1));
        if (['section', 'block', 'code', 'source', 'workspace'].some(key => query.has(key)) ||
            ['hw', 'set', 'board', 'room'].some(key => fragment.has(key))) {
          location.replace('oge.html' + search + hash);
        }
      }
      forwardOldLink();
      addEventListener('hashchange', forwardOldLink);
    })();
  </script>
  <script src="entry/exam-preference.js?v=practice-first" data-entry></script>
  <link rel="stylesheet" href="entry/entry.css">
  <script src="entry/entry.js?v=early-tap-1" defer></script>
  <script src="entry/cover-atom.js" defer></script>
</head>
<body>
  <header class="masthead">
    <img class="wordmark" src="assets/invariant-wordmark-still.png" width="333" height="39" alt="INVARIANT">
    <a class="quiet-link tutor" href="teach.html">Кабинет репетитора</a>
  </header>

  <main class="entry">
    <div class="cover-copy">
      <h1>Физика <span>для ОГЭ и ЕГЭ</span></h1>
      <p>Разбирай теорию, решай задачи по темам и проверяй себя на пробниках.</p>
    </div>
    <div class="atom-screen" aria-hidden="true">
      <div class="atom-screen-media">
        <img class="atom-poster" src="entry/cover-atom.webp" alt="" width="480" height="480">
        <canvas class="atom-canvas"></canvas>
      </div>
    </div>

    <section class="exam-chooser" aria-labelledby="exam-chooser-title">
      <h2 id="exam-chooser-title">Выбери свой экзамен</h2>
      <nav class="exams" aria-label="Экзамены по физике">
        <a class="exam exam--oge" href="oge.html" data-exam-choice="oge" aria-label="Я ученик ОГЭ, 9 класс">
          <span class="exam-sign"><span class="exam-word">ОГЭ<span class="exam-shine" aria-hidden="true">ОГЭ</span></span><span class="baseline" aria-hidden="true"></span></span>
          <span class="exam-grade">9 класс</span>
          <canvas class="particles" aria-hidden="true" hidden></canvas>
        </a>
        <a class="exam exam--ege" href="ege-bank.html" data-exam-choice="ege" aria-label="Я ученик ЕГЭ, 11 класс">
          <span class="exam-sign"><span class="exam-word">ЕГЭ<span class="exam-shine" aria-hidden="true">ЕГЭ</span></span><span class="baseline" aria-hidden="true"></span></span>
          <span class="exam-grade">11 класс</span>
          <canvas class="particles" aria-hidden="true" hidden></canvas>
        </a>
      </nav>
    </section>
    <a class="quiet-link mocks" href="mocks.html?exam=ege"><span class="mocks-icon" aria-hidden="true"></span>Пробники</a>
    <button class="atom-toggle" type="button" hidden></button>
  </main>
  <div class="entry-progress" aria-hidden="true">Открываем задачник…</div>
</body>
</html>
