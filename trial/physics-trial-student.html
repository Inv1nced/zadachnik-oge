add('Опыт с жидкостями',()=>slide('ОПЫТ','Один шарик, разные жидкости','<div class="split"><div><p class="lead">Что покажет динамометр, если перенести один и тот же медный шарик из керосина в воду?</p><div class="actions">'+btn('Керосин','density:800')+btn('Вода','density:1000')+btn('Солёная вода','density:1200')+'</div><div class="actions">'+btn(state.immersed?'Поднять шарик':'Погрузить шарик','immerse','class="primary"')+btn('Сбросить опыт','sim-reset')+'</div><div class="actions">'+['Яйцо в солёной воде','Мёртвое море','Стальной корабль'].map((x,i)=>btn(x,'example:'+i)).join('')+'</div>'+(state.example!==''?'<div class="panel"><p>'+['Плотный солевой раствор может вытолкнуть яйцо до поверхности.','В более плотной воде для равновесия телу достаточно вытеснить меньший объём.','Плавучесть определяется вытесненной водой и весом всего судна с заполненным воздухом корпусом.'][state.example]+'</p></div>':'')+'</div><div class="diagram" id="buoy">'+buoy()+'<label class="control">Плотность <input id="density" type="range" min="700" max="1250" step="10" value="'+state.density+'"><output id="rho">'+state.density+' кг/м³</output></label></div></div>'));
function buoy(){const rho=state.density,g=9.81,V=.00010,weight=8960*g*V,F=state.immersed?rho*g*V:0,y=state.immersed?166:97;return '<div id="buoy-v">'+svg('Динамометр и силы, действующие на медный шарик',stroke('M89 13v'+(y-14),soft)+stroke('M27 121v105h136V121',soft)+rect(28,135,134,90,rho<900?'#73512c':'#24597d')+dot(90,y,16,'#d89462')+stroke('M90 '+y+'v48 m-5 -7 5 7 5 -7',gold)+(F?stroke('M126 '+y+'v-33 m-5 7 5 -7 5 7',mint):'')+txt(200,67,'Показание  '+(weight-F).toFixed(2).replace('.',',')+' Н',mint)+txt(200,106,'Сила тяжести  '+weight.toFixed(2).replace('.',',')+' Н',gold)+txt(200,145,'Сила Архимеда  '+F.toFixed(2).replace('.',',')+' Н',mint)+txt(200,186,'Полное погружение: Fₐ = ρgV',soft,'class="small"')+txt(200,210,'V шарика = 100 см³',soft,'class="small"'))+'</div>';}
const groupIndices=[];
groups.forEach((g,j)=>{

function groupSlide(g,j){const q=state.groups[j];const truth=g.key.split('').map(Number);const missing=truth.filter(x=>!q.picks.includes(x)).length;const extra=q.picks.filter(x=>!truth.includes(x)).length;const score=Math.max(0,2-Math.max(missing,extra));return slide('В ФОРМАТЕ №18 · КОМПЛЕКТ '+(j+1),g.name,'<p>Выбери все верные утверждения. Номер отмечает пункт для ответа, текст открывает обсуждение.</p><div class="sheet">'+g.items.map((x,i)=>'<div class="statement">'+press(i+1,'pick:'+j+':'+(i+1),q.picks.includes(i+1))+btn(esc(x.text),'go:'+(groupIndices[j]+i+1),'class="read"')+'</div>').join('')+'</div><div class="actions">'+btn(q.show?'Скрыть ответ':'Показать ответ','group-show:'+j,'class="primary"')+btn('Сбросить выбор','group-reset:'+j)+'</div>'+(q.show?'<div class="panel"><p><b>Ответ '+g.key+'</b> · '+(q.picks.length?'За этот выбор: '+score+' из 2.':'Максимум 2 первичных балла.')+'</p></div>':'')+'<div class="source">Тренировочный комплект из адаптированных утверждений · '+link(g.source,'демоверсия '+g.year)+' · '+link(bank,'подборка №18')+'</div>');}
function detail(g,j,item,i){const q=state.groups[j].items[i];return slide('КОМПЛЕКТ '+(j+1)+' · УТВЕРЖДЕНИЕ '+(i+1)+' ИЗ 5',item.title,'<div class="split detailgrid"><div><p class="detailtext">'+esc(item.text)+'</p><div class="actions">'+press('Верно','guess:'+j+':'+i+':1',q.guess===true)+press('Неверно','guess:'+j+':'+i+':0',q.guess===false)+'</div><div class="actions">'+btn(q.hint?'Скрыть подсказку':'Подсказка','hint:'+j+':'+i)+btn(q.show?'Скрыть разбор':'Открыть разбор','explain:'+j+':'+i,'class="primary"')+'</div>'+(q.hint?'<div class="panel"><p>'+esc(item.hint)+'</p></div>':'')+(q.show?'<div class="panel"><p><b>'+(item.truth?'Верно.':'Неверно.')+'</b> '+esc(item.explain)+'</p></div>':'')+'<div class="source">'+link(item.source,item.ref)+'</div></div><div class="diagram"><div id="detail-demo">'+demo(item.demo,q.value)+'</div><div class="actions">'+btn('Показать следующий шаг','demo:'+j+':'+i)+btn('Вернуть схему','demo-reset:'+j+':'+i)+'</div></div></div><div class="subnav">'+btn('Все пять','go:'+groupIndices[j])+g.items.map((_,n)=>btn(n+1,'go:'+(groupIndices[j]+n+1),n===i?'aria-current="step" aria-pressed="true"':'')).join('')+'</div>');}
function demo(k,v){const t=v%4;let b='';switch(k){
 case 'ramp': {const x=[63,179,297,415][t],y=[195,157,118,78][t];b=stroke('M47 205H125v-40h60v-40h60V85h175',soft)+stroke('M57 205 420 85',mint)+stroke('M445 205V85 m-6 8 6 -8 6 8',gold)+dot(x,y,12,mint)+dot([110,169,231,400][t],[193,151,112,73][t],10,gold)+txt(58,236,'Лестница и наклонный подъём')+txt(457,151,'h',gold);break;}
 case 'diffuse': {b=rect(40,47,205,160,'#173552','rx="12"')+rect(275,47,205,160,'#25344b','rx="12"');for(let i=0;i<26;i++){let a=i*2.39996,r=Math.sqrt(i)*[3,9,14,17][t];b+=dot(140+Math.cos(a)*r,124+Math.sin(a)*r,3,mint)+dot(378+Math.cos(a)*r*.29,124+Math.sin(a)*r*.29,3,gold)}b+=txt(105,238,'Жидкость')+txt(324,238,'Твёрдое тело');break;}
 case 'circle': {const a=t*Math.PI*2/3;const x=260+87*Math.sin(a),y=128-87*Math.cos(a);b=dot(260,128,87,'none','stroke="#6785a0" stroke-width="3"')+stroke('M 260 41 A87 87 0 0 1 347 128',gold)+stroke('M260 41L'+x+' '+y,mint,'stroke-dasharray="5 6"')+dot(260,41,6,gold)+dot(x,y,9,mint)+txt(36,51,'Старт')+txt(367,211,['Начало','⅓ круга','⅔ круга','Полный круг'][t]);break;}
 case 'evap': {b=stroke('M56 115 78 218h116l20 -103 M270 181l13 37h188l13 -37',soft)+rect(67,150,135,65,'#24597d')+rect(278,191,198,23,'#24597d')+txt(83,248,'Стакан')+txt(326,248,'Поднос');for(let i=0;i<7;i++){const x=i<2?105+i*50:287+(i-2)*42,y=(i<2?144:187)-t*12-(i%3)*8;b+=dot(x,y,4,mint)}break;}
 case 'mirror': {const a=[20,35,50,65][t]*Math.PI/180,dx=150*Math.sin(a),dy=150*Math.cos(a);b=stroke('M46 193H474',soft)+stroke('M260 23V217',soft,'stroke-dasharray="6 7"')+stroke('M'+(260-dx)+' '+(193-dy)+'L260 193',gold)+stroke('M260 193L'+(260+dx)+' '+(193-dy),mint)+dot(260,193,5)+txt(30,232,'Поворот луча: '+[20,35,50,65][t]+'° от перпендикуляра')+txt(273,42,'Перпендикуляр',soft,'class="small"');break;}
 case 'spring': {let s='M55 130h24';const end=235+t*59;for(let i=0;i<18;i++)s+='L'+(79+(end-79)*(i+1)/18)+' '+(i===17?130:i%2?145:115);b=stroke('M55 83v94',soft)+stroke(s,mint)+rect(end,108,40,44,gold,'rx="5"')+stroke('M'+(end+46)+' 130h30',gold)+txt(55,202,'Удлинение '+(t+1)+' см');break;}
 case 'charge': {b=dot(134,124,61,'#355473')+dot(388,124,61,'#644c61')+txt(88,211,'Волосы')+txt(353,211,'Шарик');for(let i=0;i<t;i++){b+=txt(108+i*17,130,'+',gold)+txt(366+i*17,130,'−',mint)}if(t)b+=stroke('M211 124h96 l-8 -7 m8 7 -8 7',mint)+txt(212,95,'электроны',mint);break;}
 case 'weight': {const x=t*30;b=rect(42,44,430,173,'#14263a','rx="34" stroke="#526e87"')+rect(95+x,75,74,41,'#b0c2ca','rx="6"')+rect(96+x*.5,147,108,46,'#d6986d','rx="6"')+txt(260,106,'Лёгкая коробка')+txt(260,177,'Тяжёлый ящик');break;}
 case 'tone': {b=stroke('M49 102H480 M49 195H480',soft);for(let j=0;j<2;j++){let s='';for(let i=0;i<=415;i+=3)s+=(i?' L':'M')+(51+i)+' '+((j?195:102)-22*Math.sin(i/415*2*Math.PI*((j?5:2)+t)));b+=stroke(s,j?mint:gold)}b+=txt(49,44,'Одинаковый интервал времени')+txt(430,236,'t');break;}
 case 'friction': {const flat=t%2===0;b=stroke('M55 184H465',soft)+rect(227,flat?139:101,flat?120:49,flat?45:83,'#d6986d','rx="4"')+stroke('M'+(flat?289:251)+' '+(flat?145:112)+'v28',gold)+txt(129,229,flat?'Брусок на широкой грани':'Тот же брусок на ребре');break;}
 }return svg('Учебная схема',b);}
add('Кинематика KIN-01',()=>slide('КИНЕМАТИКА · ЗАДАЧА В ЗАПАСЕ','Робот между стеллажами','<div class="split detailgrid"><div><p class="detailtext">Робот движется вдоль прохода по оси Ox. По графику координаты найди проекцию скорости в момент <b>t = 4 с</b>.</p><form id="kin-form" class="actions"><label>vₓ <input id="kin-answer" type="text" inputmode="decimal" size="6" value="'+esc(state.kin.answer)+'"> м/с</label><button class="primary">Проверить</button></form><div class="status" role="status">'+(state.kin.check?(numberAnswer(state.kin.answer)===-3?'Верно.':'Попробуй найти наклон прямого участка.'):'')+'</div><div class="actions">'+btn(state.kin.highlight?'Снять выделение':'Выделить участок','kin-highlight')+btn(state.kin.step===3?'Скрыть решение':'Шаг решения '+(state.kin.step+1),'kin-step')+'</div>'+(state.kin.step?'<div class="panel">'+['4 с находится между 2 и 6 с. На прямом участке скорость постоянна.','Δx = 6 − 18 = −12 м, а Δt = 6 − 2 = 4 с.','vₓ = Δx / Δt = −3 м/с. Минус означает движение в сторону меньших координат.'].slice(0,state.kin.step).map(p=>'<p>'+p+'</p>').join('')+'</div>':'')+'<div class="source">'+link(site,'Авторская задача Invariant · KIN-01')+'</div></div><div class="diagram"><div id="kin-v">'+kinGraph()+'</div><label class="control">Время <input type="range" id="kin-time" min="0" max="8" step=".05" value="'+state.kin.t+'"><output id="kin-t">'+state.kin.t.toFixed(1)+' с</output></label><div class="actions">'+btn('Пуск','kin-play')+btn('Пауза','kin-pause')+btn('Сброс','kin-reset')+'</div></div></div>'));
function numberAnswer(s){const x=s.trim().replace(/−/g,'-').replace(',','.');return /^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(x)?Number(x):NaN;}
function kinGraph(){const t=state.kin.t,x=t<=2?18:t>=6?6:18-3*(t-2),X=a=>56+49*a,Y=a=>191-a*7.9;let g=stroke('M56 25V191H467',soft);for(let a=0;a<=8;a++){g+=stroke('M'+X(a)+' 187v8','#476176');if(a%2===0)g+=txt(X(a)-4,211,a,soft,'class="small"')}for(const a of [0,6,12,18]){g+=stroke('M56 '+Y(a)+'H448','#334d61');g+=txt(26,Y(a)+4,a,soft,'class="small"')}return svg('График координаты робота и линейная модель движения',g+txt(30,22,'x, м')+txt(465,212,'t, с')+stroke('M'+X(0)+' '+Y(18)+'H'+X(2)+' L'+X(6)+' '+Y(6)+'H'+X(8),mint)+(state.kin.highlight?stroke('M'+X(2)+' '+Y(18)+'L'+X(6)+' '+Y(6),gold,'style="stroke-width:6"'):'')+stroke('M'+X(t)+' '+Y(x)+'V191',soft,'stroke-dasharray="4 5"')+dot(X(t),Y(x),6,gold)+stroke('M56 250H450',soft)+rect(64+x*17,231,29,19,mint,'rx="4"')+txt(56,268,'0',soft,'class="small"')+txt(444,268,'Ox',soft,'class="small"'),'0 0 520 278');}
add('План подготовки',()=>slide('ПОДГОТОВКА','Как будем готовиться','<ul class="plain endlist lead"><li>Восстановим базу</li><li>Разберём типовые задания</li><li>Вернёмся к ошибкам и усложним задачи</li><li>Перейдём к полным вариантам</li></ul><p class="record">Два занятия в неделю по 60 минут, домашние задания с проверкой и вопросы между уроками.</p>'));
add('Итог',()=>slide('ИТОГ','Что стало понятнее?','<p class="lead">Вспомни один момент, когда по схеме стало ясно, как ответить на задачу.</p><p class="muted">С какой темы тебе хотелось бы начать подготовку?</p>'));
const jumpIndices=[0,1,2,3,4,...groupIndices,slides.length-3,slides.length-2,slides.length-1];
let current=0, timer=null;
const $main=$('main'), overlay=$('overlay');
function render(){const y=$main.scrollTop;$main.innerHTML=slides[current].render();$main.scrollTop=y;$('counter').textContent=(current+1)+' / '+slides.length;$('prev').disabled=current===0;$('next').disabled=current===slides.length-1;$('progress').style.width=((current+1)/slides.length*100)+'%';}
function stop(){window.clearInterval(timer);timer=null;}
function go(i){if(i<0||i>=slides.length)return;stop();current=i;$main.scrollTop=0;render();$main.focus({preventScroll:true});}
function close(){overlay.hidden=true;$('toc').focus();}
$('jumps').innerHTML=jumpIndices.map(i=>btn(esc(slides[i].name),'go:'+i)).join('');
$('toc').onclick=()=>{overlay.hidden=false;$('jumps').querySelector('button').focus();};
$('close-menu').onclick=close;
overlay.addEventListener('click',e=>{if(e.target===overlay)close();});
$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);
$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.webkitFullscreenElement)document.webkitExitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else if(document.documentElement.webkitRequestFullscreen)document.documentElement.webkitRequestFullscreen();else throw Error();}catch{alert('Полноэкранный режим можно включить через меню браузера.');}};
function fullLabel(){$('full').textContent=document.fullscreenElement||document.webkitFullscreenElement?'Выйти из полноэкранного':'На весь экран';}
document.addEventListener('fullscreenchange',fullLabel);document.addEventListener('webkitfullscreenchange',fullLabel);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!overlay.hidden){close();return;}if(!overlay.hidden||e.target.matches('input,textarea,select')||e.altKey||e.metaKey||e.ctrlKey)return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();go(current+(e.key==='ArrowRight'?1:-1));}});
function toggleNum(list,n){return list.includes(n)?list.filter(x=>x!==n):[...list,n];}
function updateTime(){const el=$('kin-v');if(!el)return;el.innerHTML=kinGraph();$('kin-time').value=state.kin.t;$('kin-t').textContent=state.kin.t.toFixed(1)+' с';}
function play(){stop();if(state.kin.t>=8)state.kin.t=0;let last=performance.now();timer=setInterval(()=>{const now=performance.now();state.kin.t=Math.min(8,state.kin.t+(now-last)/600);last=now;updateTime();if(state.kin.t>=8)stop();},33);}
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-do]');if(!el)return;
 const [action,a,b,c]=el.dataset.do.split(':');const j=Number(a),k=Number(b);
 const group=state.groups[j], item=group?.items[k];
 switch(action){
 case 'go': overlay.hidden=true;go(j);return;
 case 'hero':state.motion=!state.motion;break;
 case 'arch':state.arch=state.arch.length===2&&!state.arch.includes(j)?[state.arch[1],j]:toggleNum(state.arch,j);state.archCheck=false;break;
 case 'arch-check':state.archCheck=true;break;
 case 'arch-show':state.archShow=!state.archShow;break;
 case 'arch-reset':state.arch=[];state.archCheck=false;state.archShow=false;break;
 case 'density':state.density=j;break;
 case 'immerse':state.immersed=1-state.immersed;break;
 case 'sim-reset':state.immersed=0;state.density=1000;state.example='';break;
 case 'example':state.example=state.example===j?'':j;break;
 case 'pick':group.picks=toggleNum(group.picks,k);break;
 case 'group-show':group.show=!group.show;break;
 case 'group-reset':group.picks=[];group.show=false;group.items.forEach(x=>Object.assign(x,{guess:null,show:false,hint:false,value:0}));break;
 case 'guess':item.guess=Boolean(Number(c));group.picks=group.picks.filter(x=>x!==k+1);if(item.guess)group.picks.push(k+1);break;
 case 'hint':item.hint=!item.hint;break;
 case 'explain':item.show=!item.show;break;
 case 'demo':item.value++;$('detail-demo').innerHTML=demo(groups[j].items[k].demo,item.value);return;
 case 'demo-reset':item.value=0;$('detail-demo').innerHTML=demo(groups[j].items[k].demo,0);return;
 case 'kin-highlight':state.kin.highlight=!state.kin.highlight;break;
 case 'kin-step':state.kin.step=(state.kin.step+1)%4;break;
 case 'kin-play':play();return;
 case 'kin-pause':stop();return;
 case 'kin-reset':stop();Object.assign(state.kin,{answer:'',check:false,highlight:false,step:0,t:0});break;
 default:return;
 }
 const command=el.dataset.do;render();Array.from($main.querySelectorAll('[data-do]')).find(node=>node.dataset.do===command)?.focus({preventScroll:true});
});
document.addEventListener('submit',e=>{if(e.target.id==='kin-form'){e.preventDefault();state.kin.check=true;render();$('kin-answer').focus();}});
document.addEventListener('input',e=>{if(e.target.id==='kin-answer')state.kin.answer=e.target.value;if(e.target.id==='kin-time'){stop();state.kin.t=Number(e.target.value);updateTime();}if(e.target.id==='density'){state.density=Number(e.target.value);$('rho').textContent=state.density+' кг/м³';$('buoy-v').outerHTML=buoy();}});
render();
</script></html>
