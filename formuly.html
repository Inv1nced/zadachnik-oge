<script>

<div class="panel"><h2>Четыре приёма</h2>
<div class="rule"><span class="num">1</span><div><b>Слагаемое переносим в другую часть — со сменой знака.</b> Было «+», стало «−», и наоборот.
<div class="ex">v = v₀ + at<br>v − v₀ = at <span class="c">← v₀ перенесли влево, «+» стал «−»</span></div></div></div>
<div class="rule"><span class="num">2</span><div><b>Множитель убираем делением обеих частей.</b> Буква, которая стоит рядом с нужной через «·», уходит вниз, в знаменатель с другой стороны.
<div class="ex">v − v₀ = at<br>a = (v − v₀) / t <span class="c">← разделили обе части на t</span><br><b>Важно:</b> скобка! Делим всю правую часть, а не только v₀.</div></div></div>

<div class="ex" style="flex:1;min-width:220px"><span class="c">Шпаргалка «треугольник» для формул вида s = v·t:<br>закрой пальцем нужную букву — останется ответ.</span><br>s = v·t &nbsp;·&nbsp; v = s/t &nbsp;·&nbsp; t = s/v<br><span class="c">Так же: ρ = m/V, a = (v−v₀)/t, ν = N/t…</span></div></div></div></div>
<div class="rule"><span class="num">4</span><div><b>Квадрат убираем корнем.</b> Сначала оставляем квадрат один, потом извлекаем корень из всей правой части.

<div class="panel"><h2>Как проверить себя за 10 секунд</h2><p style="margin:0">Подставь простые числа. Пусть s = 10, t = 2 — тогда v = s/t = 5. Теперь проверь свою формулу: если получилось t = v/s, то t = 5/10 = 0,5 — а должно быть 2. Значит, ошибка. <b>t = s/v = 10/5 = 2 ✓</b></p></div>
<div class="row"><button class="btn" onclick="setView('drill')">Потренироваться →</button></div></section>`;
/* задания: f — формула, x — что выразить, ok — верный ответ, bad — неверные, st — шаги, vals — числа для проверки, fn — функции для проверки вариантов */

 {g:"a",f:"v = v₀ + at",x:"t",o:[["t = (v − v₀) / a",V=>(V.v-V.v0)/V.a],["t = (v − v₀)·a",V=>(V.v-V.v0)*V.a],["t = v/a − v₀",V=>V.v/V.a-V.v0],["t = (v + v₀) / a",V=>(V.v+V.v0)/V.a]],st:[["v − v₀ = at","перенесли v₀"],["t = (v − v₀) / a","разделили на a"]],vals:{v:10,v0:4,a:2,t:3}},

 {g:"a",f:"x = x₀ + vt",x:"t",o:[["t = (x − x₀) / v",V=>(V.x-V.x0)/V.v],["t = (x + x₀) / v",V=>(V.x+V.x0)/V.v],["t = x/v − x₀",V=>V.x/V.v-V.x0],["t = (x − x₀)·v",V=>(V.x-V.x0)*V.v]],st:[["x − x₀ = vt","перенесли x₀"],["t = (x − x₀) / v","разделили на v"]],vals:{x:26,x0:20,v:3,t:2}},
 {g:"s",f:"s = at² / 2",x:"a",o:[["a = 2s / t²",V=>2*V.s/V.t**2],["a = s / (2t²)",V=>V.s/(2*V.t**2)],["a = 2s·t²",V=>2*V.s*V.t**2],["a = s·t² / 2",V=>V.s*V.t**2/2]],st:[["2s = at²","умножили на 2"],["a = 2s / t²","разделили на t²"]],vals:{a:2,t:3,s:9}},
 {g:"s",f:"s = at² / 2",x:"t",o:[["t = √(2s / a)",V=>Math.sqrt(2*V.s/V.a)],["t = 2s / a",V=>2*V.s/V.a],["t = √(s / 2a)",V=>Math.sqrt(V.s/(2*V.a))],["t = √(2a / s)",V=>Math.sqrt(2*V.a/V.s)]],st:[["2s = at²","умножили на 2"],["t² = 2s / a","разделили на a"],["t = √(2s / a)","извлекли корень"]],vals:{a:2,t:3,s:9}},
 {g:"s",f:"h = gt² / 2",x:"t",o:[["t = √(2h / g)",V=>Math.sqrt(2*V.h/V.g)],["t = 2h / g",V=>2*V.h/V.g],["t = √(hg / 2)",V=>Math.sqrt(V.h*V.g/2)],["t = √(2g / h)",V=>Math.sqrt(2*V.g/V.h)]],st:[["2h = gt²","умножили на 2"],["t² = 2h / g","разделили на g"],["t = √(2h / g)","корень"]],vals:{g:10,t:3,h:45}},
 {g:"s",f:"v² = 2as",x:"s",o:[["s = v² / (2a)",V=>V.v**2/(2*V.a)],["s = 2a / v²",V=>2*V.a/V.v**2],["s = 2a·v²",V=>2*V.a*V.v**2],["s = v / (2a)",V=>V.v/(2*V.a)]],st:[["s = v² / (2a)","разделили обе части на 2a"]],vals:{v:6,a:2,s:9}},

 {g:"s",f:"s = (v₀ + v)/2 · t",x:"t",o:[["t = 2s / (v₀ + v)",V=>2*V.s/(V.v0+V.v)],["t = s / (2(v₀ + v))",V=>V.s/(2*(V.v0+V.v))],["t = 2s·(v₀ + v)",V=>2*V.s*(V.v0+V.v)],["t = (v₀ + v) / (2s)",V=>(V.v0+V.v)/(2*V.s)]],st:[["2s = (v₀ + v)·t","умножили на 2"],["t = 2s / (v₀ + v)","разделили на скобку"]],vals:{v0:4,v:10,t:3,s:21}},
 {g:"c",f:"ν = 1 / T",x:"T",o:[["T = 1 / ν",V=>1/V.nu],["T = ν",V=>V.nu],["T = ν − 1",V=>V.nu-1],["T = 1 − ν",V=>1-V.nu]],st:[["ν·T = 1","умножили на T"],["T = 1 / ν","разделили на ν"]],vals:{T:0.5,nu:2}},
 {g:"c",f:"v = 2πR / T",x:"R",o:[["R = vT / (2π)",V=>V.v*V.T/(2*Math.PI)],["R = 2πv / T",V=>2*Math.PI*V.v/V.T],["R = 2π·vT",V=>2*Math.PI*V.v*V.T],["R = 2πT / v",V=>2*Math.PI*V.T/V.v]],st:[["v·T = 2πR","умножили на T"],["R = vT / (2π)","разделили на 2π"]],vals:{R:2,T:4,v:Math.PI}},
 {g:"c",f:"v = 2πR / T",x:"T",o:[["T = 2πR / v",V=>2*Math.PI*V.R/V.v],["T = v / (2πR)",V=>V.v/(2*Math.PI*V.R)],["T = 2πR·v",V=>2*Math.PI*V.R*V.v],["T = vR / (2π)",V=>V.v*V.R/(2*Math.PI)]],st:[["v·T = 2πR","умножили на T"],["T = 2πR / v","разделили на v"]],vals:{R:2,T:4,v:Math.PI}},
 {g:"c",f:"a = v² / R",x:"R",o:[["R = v² / a",V=>V.v**2/V.a],["R = a / v²",V=>V.a/V.v**2],["R = a·v²",V=>V.a*V.v**2],["R = v / a",V=>V.v/V.a]],st:[["a·R = v²","умножили на R"],["R = v² / a","разделили на a"]],vals:{v:6,R:4,a:9}},
 {g:"c",f:"a = v² / R",x:"v",o:[["v = √(aR)",V=>Math.sqrt(V.a*V.R)],["v = aR",V=>V.a*V.R],["v = √(a / R)",V=>Math.sqrt(V.a/V.R)],["v = √(R / a)",V=>Math.sqrt(V.R/V.a)]],st:[["a·R = v²","умножили на R"],["v = √(aR)","корень"]],vals:{v:6,R:4,a:9}}];
const GROUPS={all:"Все",v:"v = s/t",a:"Скорость и ускорение",s:"Квадраты и корни",c:"Окружность"};

function drawDrill(){const {q,opts}=D.cur;
 V.innerHTML=`<section><div class="hero"><div class="kicker">Тренажёр · <span class="score">верно <b>${D.ok}</b> из ${D.n}</span></div><h1>Вырази <span class="grad">букву</span></h1></div>
 <div class="chips" id="grp">${Object.entries(GROUPS).map(([k,v])=>`<button class="chip" data-g="${k}" aria-pressed="${D.g===k}">${v}</button>`).join("")}</div>
 <div class="panel"><div class="hint">Формула</div><div class="q">${q.f}</div><div style="margin-top:8px">Вырази <span class="q t" style="font-size:22px">${q.x}</span></div>

 $("#grp").onclick=e=>{const b=e.target.closest("[data-g]");if(!b)return;D.g=b.dataset.g;D.order=[];next()};
 $("#opts").onclick=e=>{const b=e.target.closest(".opt");if(!b||D.cur.done)return;D.cur.done=true;const p=opts[+b.dataset.i];const ok=p.k===0;D.n++;if(ok)D.ok++;
  document.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(opts[+x.dataset.i].k===0)x.classList.add("ok")});if(!ok)b.classList.add("no");
