      <stop offset=".65" stop-color="#495bc4"/>
      <stop offset="1" stop-color="#344198"/>
    </linearGradient>
    <linearGradient id="glint" gradientUnits="userSpaceOnUse" x2="144" y2="0" gradientTransform="skewX(-19)" spreadMethod="repeat">
      <stop stop-color="#c8c4ff" stop-opacity="0"/>
      <stop offset=".26" stop-color="#c8c4ff" stop-opacity="0"/>
      <stop offset=".47" stop-color="#c2f4ff" stop-opacity=".55"/>
      <stop offset=".59" stop-color="#dcceff" stop-opacity=".38"/>
      <stop offset=".80" stop-color="#d8c8ff" stop-opacity="0"/>
