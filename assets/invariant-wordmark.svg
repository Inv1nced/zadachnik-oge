      <use href="#letters" x="2" y="4"/>
      <use href="#letters" x="3" y="6"/>
      <use href="#letters" x="4" y="8"/>
    </g>
    <use href="#letters" x="4" y="8" fill="url(#pixels)"/>
    <use href="#letters" fill="url(#surface)"/>
    <g mask="url(#face)">
