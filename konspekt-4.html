<title>Конспект · урок 4</title><meta name="robots" content="noindex">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
:root{color-scheme:dark;--bg:#060A17;--bg2:#0B1226;--panel:#0F1830;--panel2:#131F3D;--line:#1F2C52;--line2:#2C3D6E;--text:#E9EEFF;--text2:#A4B1D6;--muted:#6D7BA6;--cyan:#3BE3FF;--violet:#8E72FF;--pink:#FF5FD2;--ok:#35F2A2;--err:#FF5C7A;--amber:#FFBE55;
--f-d:"Unbounded","Arial Black",system-ui,sans-serif;--f-b:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--f-m:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-b);font-size:16px;line-height:1.6}
.app{max-width:900px;margin:0 auto;padding:0 18px 80px}
.top{position:sticky;top:0;z-index:5;margin:0 -18px;padding:12px 18px;background:rgba(6,10,23,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap;font:700 13px var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--text2)}
.top a{color:var(--text2);text-decoration:none;border:1px solid var(--line2);border-radius:9px;padding:6px 10px;letter-spacing:0;text-transform:none;font:600 13px var(--f-b)}
.top a:hover{color:var(--cyan);border-color:var(--cyan)}
.top .sp{flex:1}
.hero{padding:28px 0 14px}.kicker{font:12px var(--f-m);letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
h1{font-family:var(--f-d);font-weight:800;font-size:clamp(26px,5vw,42px);line-height:1.08;margin:8px 0 10px;letter-spacing:-.02em;text-wrap:balance}
h1 .grad{background:linear-gradient(90deg,var(--cyan),var(--violet) 55%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--text2);margin:0}
.panel,.blk{background:linear-gradient(180deg,rgba(19,31,61,.85),rgba(12,20,40,.85));border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-top:14px}
.toc{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.toc b{margin-right:4px}
.toc a{color:var(--text);text-decoration:none;border:1px solid var(--line2);background:var(--bg2);border-radius:999px;padding:5px 12px;font-size:14px}.toc a:hover{border-color:var(--cyan);color:var(--cyan)}
h2{font:700 19px var(--f-d);margin:0 0 10px;display:flex;flex-wrap:wrap;gap:10px;align-items:baseline}
.tm{font:600 12px var(--f-m);color:var(--amber);letter-spacing:.04em}
code{font:600 15px var(--f-m);color:var(--cyan);background:rgba(59,227,255,.08);border:1px solid rgba(59,227,255,.25);border-radius:7px;padding:1px 7px;white-space:nowrap}
.ftab{display:grid;gap:6px}.fh{font:700 12px var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--violet);margin-top:8px}
.fr{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:7px 10px;background:var(--bg2);border:1px solid var(--line);border-radius:10px}.fr span{color:var(--text2);font-size:14.5px}.fr span b{color:var(--text)}
.say{border-left:3px solid var(--violet);background:rgba(142,114,255,.08);padding:10px 14px;border-radius:0 10px 10px 0;margin:0 0 10px}
.steps{margin:8px 0;padding-left:22px;display:grid;gap:6px}.steps a{color:var(--cyan)}
.ex{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:10px 0}.ex b{color:var(--ok)}.ex>b:first-child{color:var(--text)}
.tasks{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}.tasks>b{margin-right:4px}
.tk{font-size:14px;border:1px solid var(--line2);border-radius:10px;padding:4px 10px;background:var(--panel)}.tk b{color:var(--ok)}
.tip{margin-top:12px;padding:10px 14px;border-left:3px solid var(--cyan);background:rgba(59,227,255,.07);border-radius:0 10px 10px 0}
.warn{margin-top:10px;padding:10px 14px;border-left:3px solid var(--amber);background:rgba(255,190,85,.08);border-radius:0 10px 10px 0}
.sc{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:8px}
.muted{color:var(--muted);font-size:14px}
.login{max-width:420px;margin:60px auto}.login input{width:100%;background:var(--bg);border:1px solid var(--line2);color:var(--text);border-radius:10px;padding:11px 12px;font:600 15px var(--f-m);margin:10px 0}
.btn{border:0;background:linear-gradient(135deg,var(--cyan),#7FF0FF);color:#04111A;font:700 14px var(--f-b);padding:10px 16px;border-radius:11px;cursor:pointer}
.err{color:var(--err);font-size:14px;min-height:20px}
@media (max-width:600px){.top{position:static}}
@media print{.top,.toc{display:none}body{background:#fff;color:#000}.blk{border:1px solid #999;background:#fff}code{color:#000}}

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){const raw=b64(ENC),salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);
 const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:200000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
 return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct))}
async function tryPw(pw,save){try{const html=await unlock(pw);document.getElementById("main").innerHTML=html;try{if(save)localStorage.setItem("jr_pw",pw)}catch(e){}if(location.hash){const el=document.querySelector(location.hash);el&&el.scrollIntoView()}return true}catch(e){return false}}
document.getElementById("go").onclick=async()=>{const ok=await tryPw(document.getElementById("pw").value,true);if(!ok)document.getElementById("err").textContent="Неверный пароль"};
document.getElementById("pw").onkeydown=e=>{if(e.key==="Enter")document.getElementById("go").click()};
(async()=>{let pw=null;try{pw=localStorage.getItem("jr_pw")}catch(e){}if(pw)await tryPw(pw,false)})();
</script></body></html>
