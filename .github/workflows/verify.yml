name: Verify Zadachnik

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify-learning.cjs && node scripts/verify-frog.cjs
      - run: npm install --no-save --no-package-lock playwright-core@1.65.1
      - run: npx playwright-core install --with-deps chromium
      - run: node scripts/verify-study-flows.cjs
