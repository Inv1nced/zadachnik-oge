<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>Журнал репетитора</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#060A17; --bg2:#0B1226; --panel:#0F1830; --panel2:#131F3D; --line:#1F2C52; --line2:#2C3D6E;
  --text:#E9EEFF; --text2:#A4B1D6; --muted:#6D7BA6;
  --cyan:#3BE3FF; --violet:#8E72FF; --pink:#FF5FD2;
  --ok:#35F2A2; --ok-bg:rgba(53,242,162,.12); --err:#FF5C7A; --err-bg:rgba(255,92,122,.12); --amber:#FFBE55; --amber-bg:rgba(255,190,85,.12);
  --glow:0 0 0 1px rgba(59,227,255,.35),0 0 24px rgba(59,227,255,.25);
  --f-d:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-b:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-m:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--text);font-family:var(--f-b);font-size:15.5px;line-height:1.55;min-height:100vh}
#scope{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.gridbg{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(59,227,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(59,227,255,.045) 1px,transparent 1px);background-size:32px 32px;mask-image:radial-gradient(ellipse at 50% 0%,#000 30%,transparent 80%)}
.app{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding-inline:18px;padding-block:0 80px}
/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:-18px;padding:12px 18px;background:rgba(6,10,23,.78);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-m);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--text2)}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan);animation:blink 2.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.tabs{display:flex;gap:4px;margin-left:auto;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;color:var(--text2);font:600 14px var(--f-b);padding:8px 14px;border-radius:9px;cursor:pointer;white-space:nowrap;position:relative;transition:color .2s,background .2s}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:#04111A;background:linear-gradient(135deg,var(--cyan),#7FF0FF);box-shadow:0 0 18px rgba(59,227,255,.35)}
.tab .dot{display:inline-block;min-width:18px;height:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--pink);color:#fff;font:700 11px/18px var(--f-m);text-align:center}
/* hero */
.hero{padding:40px 0 18px;display:grid;gap:14px}
.kicker{font-family:var(--f-m);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
.kicker b{color:var(--pink);font-weight:700}
h1{font-family:var(--f-d);font-weight:800;font-size:clamp(30px,6vw,58px);line-height:1.02;margin:0;letter-spacing:-.02em;text-wrap:balance}
h1 .grad{background:linear-gradient(90deg,var(--cyan),var(--violet) 55%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--text2);max-width:64ch;margin:0}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.stat{font-family:var(--f-m);font-size:12.5px;color:var(--text2);border:1px solid var(--line);background:rgba(15,24,48,.6);border-radius:10px;padding:7px 12px}
.stat b{color:var(--text);font-weight:700;margin-right:4px}
/* common */
.view{animation:fadeUp .35s ease both}
@keyframes fadeUp{from{transform:translateY(8px)}to{transform:none}}
.btn{--c:var(--cyan);border:1px solid var(--line2);background:var(--panel2);color:var(--text);font:600 14px var(--f-b);padding:10px 16px;border-radius:11px;cursor:pointer;transition:transform .12s,box-shadow .25s,border-color .25s,background .25s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 22px color-mix(in srgb,var(--c) 35%,transparent);transform:translateY(-1px)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.primary{background:linear-gradient(135deg,var(--cyan),#7FF0FF);color:#04111A;border-color:transparent}
.btn.primary:hover{box-shadow:0 0 28px rgba(59,227,255,.55)}
.btn.violet{--c:var(--violet)} .btn.pink{--c:var(--pink)}
.btn.small{padding:6px 11px;font-size:13px;border-radius:9px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;pointer-events:none}
.panel{background:linear-gradient(180deg,rgba(19,31,61,.85),rgba(12,20,40,.85));border:1px solid var(--line);border-radius:16px;padding:18px}
.h2{font-family:var(--f-d);font-weight:600;font-size:22px;margin:0}
.muted{color:var(--muted)} .t2{color:var(--text2)}
input[type=text],input[type=search],textarea,select{background:var(--bg2);border:1px solid var(--line2);color:var(--text);font:500 15px var(--f-b);border-radius:10px;padding:10px 12px;outline:none;transition:border-color .2s,box-shadow .2s;min-width:0}
input:focus,textarea:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(59,227,255,.18)}
textarea{font-family:var(--f-m);font-size:12.5px;width:100%;resize:vertical}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.src{font-family:var(--f-m);font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;letter-spacing:.05em}
.src.F{background:var(--ok-bg);color:var(--ok)} .src.D{background:rgba(255,95,210,.14);color:var(--pink)} .src.K{background:rgba(142,114,255,.16);color:#B9A8FF}
.pic{font-family:var(--f-m);font-size:11px;color:var(--amber);background:var(--amber-bg);padding:1px 6px;border-radius:4px;white-space:nowrap}
/* modules */
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin:14px 0 6px}
.mod{position:relative;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:14px;padding:14px;cursor:pointer;transition:transform .18s,border-color .25s,box-shadow .25s;overflow:hidden}
.mod:hover{transform:translateY(-2px);border-color:var(--line2)}
.mod[aria-pressed="true"]{border-color:var(--cyan);box-shadow:var(--glow)}
.mod .mi{font-family:var(--f-m);font-size:11px;color:var(--cyan);letter-spacing:.12em}
.mod .mn{font-weight:700;font-size:16px;margin:4px 0 2px}
.mod .ms{font-size:12.5px;color:var(--muted)}
.meter{height:4px;border-radius:4px;background:var(--line);margin-top:10px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--violet));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 4px}
.tools input[type=search]{flex:1 1 240px}
.chip{border:1px solid var(--line);background:transparent;color:var(--text2);font:500 13px var(--f-b);padding:6px 11px;border-radius:999px;cursor:pointer;transition:all .2s}
.chip:hover{color:var(--text);border-color:var(--line2)}
.chip[aria-pressed="true"]{color:#04111A;background:var(--violet);border-color:var(--violet);box-shadow:0 0 14px rgba(142,114,255,.45)}
/* lessons */
.lesson{margin-top:10px;border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden;transition:border-color .25s}
.lesson[open]{border-color:var(--line2)}
.lesson>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 16px}
.lesson>summary::-webkit-details-marker{display:none}
.lesson>summary:hover .ln{box-shadow:0 0 14px rgba(59,227,255,.45)}
.ln{font-family:var(--f-m);font-weight:700;font-size:12px;color:var(--cyan);border:1px solid var(--cyan);border-radius:8px;padding:5px 8px;min-width:58px;text-align:center;transition:box-shadow .25s}
.lt{font-weight:600;font-size:16px;line-height:1.3}
.lm{font-family:var(--f-m);font-size:11.5px;color:var(--muted);text-align:right;white-space:nowrap}
.lm .meter{width:96px;margin-left:auto;margin-top:6px}
.chev{transition:transform .25s;display:inline-block;margin-left:8px;color:var(--text2)}
.lesson[open] .chev{transform:rotate(90deg)}
.lb{border-top:1px dashed var(--line);padding:14px 16px 16px}
.formulas{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.formulas span{font-family:var(--f-m);font-size:12.5px;color:var(--cyan);background:rgba(59,227,255,.08);border:1px solid rgba(59,227,255,.22);padding:4px 9px;border-radius:7px}
.gh{font-family:var(--f-m);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px;font-weight:600}
.tasks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.task{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:rgba(11,18,38,.7);transition:border-color .25s,background .25s,transform .2s}
.task:hover{border-color:var(--line2)}
.task.ok{border-color:rgba(53,242,162,.55);background:linear-gradient(90deg,rgba(53,242,162,.09),rgba(11,18,38,.7) 60%)}
.task.bad{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.tt{margin:0 0 10px;overflow-wrap:anywhere}
.tn{font-family:var(--f-m);color:var(--muted);font-size:12px;margin-right:6px}
.tr{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;font-size:13px}
.tr a{color:var(--cyan);text-decoration:none;font-weight:600}
.tr a:hover{text-shadow:0 0 10px rgba(59,227,255,.6)}
.ansbox{display:inline-flex;gap:6px;align-items:center}
.ansbox input{width:110px;padding:6px 10px;font-family:var(--f-m);font-size:14px}
.verdict{font-family:var(--f-m);font-weight:700;font-size:12.5px;padding:3px 9px;border-radius:6px}
.verdict.ok{color:var(--ok);background:var(--ok-bg)} .verdict.no{color:var(--err);background:var(--err-bg)} .verdict.show{color:var(--amber);background:var(--amber-bg)}
.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6)}to{transform:none}}
.linkbtn{border:0;background:none;color:var(--text2);font:500 13px var(--f-b);cursor:pointer;padding:0;text-decoration:underline dotted;text-underline-offset:3px}
.linkbtn:hover{color:var(--text)}
/* test */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.field{display:grid;gap:6px}
.field label{font-size:13px;color:var(--text2);font-weight:600}
.lessonpick{display:flex;flex-wrap:wrap;gap:6px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--text2);font:600 14px var(--f-m);padding:8px 14px;cursor:pointer;transition:all .2s}
.seg button[aria-pressed="true"]{background:var(--cyan);color:#04111A}
.testhead{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:10;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:rgba(6,10,23,.85);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:14px 0}
.timer{font-family:var(--f-m);font-weight:700;font-size:20px;color:var(--cyan);text-shadow:0 0 12px rgba(59,227,255,.45);font-variant-numeric:tabular-nums}
.bigprog{flex:1 1 160px;height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.bigprog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--pink));transition:width .4s}
.q{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--panel)}
.q .qn{font-family:var(--f-m);font-size:12px;color:var(--violet);font-weight:700;letter-spacing:.08em}
.q input{width:170px;font-family:var(--f-m)}
.q.filled{border-color:rgba(142,114,255,.5)}
/* result */
.score{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.ring{--p:0;width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--c,var(--cyan)) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;box-shadow:0 0 40px rgba(59,227,255,.15)}
.ring>div{width:118px;height:118px;border-radius:50%;background:var(--bg);display:grid;place-items:center;text-align:center}
.ring b{font-family:var(--f-d);font-size:34px;line-height:1}
.ring small{display:block;font-family:var(--f-m);font-size:11px;color:var(--muted);margin-top:4px}
.grade{font-family:var(--f-d);font-size:26px;font-weight:800}
.rlist{display:grid;gap:6px;margin-top:14px}
.ri{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(11,18,38,.6);font-size:14px}
.ri .mk{font-family:var(--f-m);font-weight:800}
.ri.ok .mk{color:var(--ok)} .ri.no .mk{color:var(--err)}
.code{word-break:break-all}
.notice{border:1px solid rgba(255,190,85,.35);background:var(--amber-bg);color:#FFD89A;border-radius:12px;padding:10px 14px;font-size:13.5px}
/* progress */
.prow{display:grid;grid-template-columns:minmax(0,1fr) 110px 60px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.prow .meter{margin:0}
.num{font-family:var(--f-m);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-family:var(--f-m);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tablewrap{overflow-x:auto}
.pick{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:start;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:rgba(11,18,38,.6);font-size:13.5px;cursor:pointer}
.pick input{margin-top:3px;accent-color:var(--cyan)}
.pick:has(input:checked){border-color:var(--cyan);background:rgba(59,227,255,.07)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--panel2);border:1px solid var(--cyan);color:var(--text);padding:10px 16px;border-radius:12px;box-shadow:var(--glow);transition:all .3s;z-index:50;font-size:14px;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.foot{margin-top:40px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;max-width:75ch}
@media (max-width:600px){.lesson>summary{grid-template-columns:auto 1fr}.lm{grid-column:1/-1;text-align:left}.lm .meter{margin-left:0}.score{grid-template-columns:1fr;justify-items:center;text-align:center}.prow{grid-template-columns:1fr 70px 44px}.tabs{margin-left:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<div class="gridbg" aria-hidden="true"></div>
<div class="app">
 <div class="topbar"><div class="brand"><i></i>журнал репетитора · механика</div><div class="tabs" id="tabs"><button class="tab" data-v="codes" aria-selected="false">Уроки и ДЗ</button><button class="tab" data-v="add" aria-selected="true">Добавить результат</button><button class="tab" data-v="list" aria-selected="false">Результаты</button><button class="tab" data-v="stats" aria-selected="false">Статистика</button></div></div>

async function unlockJ(pw){const raw=Uint8Array.from(atob(ENC),c=>c.charCodeAt(0));const salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);
 const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:200000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
 return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct)))}
function showLogin(msg){const V=document.getElementById("view");V.innerHTML=`<section class="view"><div class="hero"><div class="kicker">вход · <b>только для репетитора</b></div><h1>Журнал <span class="grad">закрыт</span></h1><p class="lead">Введи пароль — без него коды уроков и задачи не расшифровать.</p></div>

 document.getElementById("lf").onsubmit=async e=>{e.preventDefault();const pw=document.getElementById("pw").value;document.getElementById("le").textContent="Проверяю…";
  try{const P=await unlockJ(pw);if(document.getElementById("rem").checked){try{localStorage.setItem("jr_pw",pw)}catch(e){}}start(P)}catch(err){document.getElementById("le").textContent="Неверный пароль"}}}
(async()=>{let pw=null;try{pw=localStorage.getItem("jr_pw")}catch(e){}if(pw){try{return start(await unlockJ(pw))}catch(e){}}showLogin()})();

function parse(text){const m=text.match(/RES-[A-Za-z0-9_-]+/);if(!m)throw new Error("Не нашёл код RES- в тексте");const o=b64d(m[0].slice(4));if(!o||!Array.isArray(o.r))throw new Error("Код повреждён");
 const items=o.r.map(([id36,given,ok])=>{const id=parseInt(id36,36);return {id,given:String(given||""),ok:!!ok}});

 <div class="panel" style="margin-top:14px;display:grid;gap:14px"><div class="h2" style="font-size:18px">Конструктор домашки</div>
 <p class="t2" style="margin:0">Отметь задачи из любых уроков — код сам откроет ученику только эти задачи, даже если урок ещё закрыт. «авто» — задача проверится автоматически.</p>
 <div class="grid2"><div class="field"><label for="ht">Название</label><input type="text" id="ht" value="${esc(hw.title)}" placeholder="Например: ДЗ к уроку 2"></div>
 <div class="field"><label for="hl">Урок</label><select id="hl">${ls.map(k=>`<option value="${k}" ${k===hw.l?"selected":""}>${k==="X"?"Бонус":"Урок "+k} — ${esc(LT[k][0])}</option>`).join("")}</select></div></div>
 <input type="search" id="hq" placeholder="Поиск в уроке" value="${esc(hw.q)}"><div id="hlist" style="display:grid;gap:6px;max-height:440px;overflow:auto;padding-right:4px"></div><div id="hfoot" style="display:grid;gap:10px"></div></div></section>`;
 V.querySelectorAll("[data-cc]").forEach(b=>b.onclick=()=>{const l=b.dataset.cc;copyTxt(`Открываю ${l==="X"?"бонусный раздел":"урок "+l} в задачнике! Вкладка «Задачник» → вставь код: ${CODES[l]}`)});
 fillList();fillFoot();
 V.querySelector("#ht").oninput=e=>{hw.title=e.target.value;fillFoot()};
 V.querySelector("#hl").onchange=e=>{hw.l=e.target.value;fillList()};
 V.querySelector("#hq").oninput=e=>{hw.q=e.target.value;fillList()};
 V.querySelector("#hlist").onchange=e=>{const c=e.target.closest("input[data-id]");if(!c)return;const id=+c.dataset.id;if(c.checked){if(!hw.ids.includes(id))hw.ids.push(id)}else hw.ids=hw.ids.filter(x=>x!==id);fillFoot()}}
function fillList(){const q=hw.q.toLowerCase();const list=(byLesson[hw.l]||[]).filter(r=>!q||r[6].toLowerCase().includes(q));
 V.querySelector("#hlist").innerHTML=list.map(r=>`<label class="pick"><input type="checkbox" data-id="${r[0]}" ${hw.ids.includes(r[0])?"checked":""}><span>${esc(r[6].length>170?r[6].slice(0,170)+"…":r[6])}</span><span class="muted num" style="font-size:11px">${autoChk(r)?"авто":"—"}</span></label>`).join("")||`<p class="t2">Нет задач.</p>`}
function fillFoot(){const f=V.querySelector("#hfoot");const ids=hw.ids;const ls=[...new Set(ids.map(id=>MAP[id]&&MAP[id][0]))].filter(l=>CODES[l]);
 const code=ids.length?"HW-"+b64e({t:hw.title||"Домашка",i:ids.map(x=>x.toString(36)),k:ls.map(l=>CODES[l])}):"";
 const msg=code?`Домашка «${hw.title||"Домашка"}» — ${ids.length} задач.\nОткрой задачник → вкладка «Домашка» → вставь код:\n${code}`:"";
 f.innerHTML=`<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="num">Выбрано: <b style="color:var(--cyan)">${ids.length}</b></span><button class="btn small ghost" id="hclr" ${ids.length?"":"disabled"}>Очистить</button></div>${msg?`<textarea id="hmsg" rows="4" readonly>${esc(msg)}</textarea><div><button class="btn primary" id="hcp">Скопировать сообщение для ученика</button></div>`:""}`;
 f.querySelector("#hclr").onclick=()=>{hw.ids=[];fillList();fillFoot()};const cp=f.querySelector("#hcp");if(cp)cp.onclick=()=>copyTxt(msg,f.querySelector("#hmsg"))}

function render(){if(!document.getElementById("lo")){const t=document.getElementById("tabs");const b=document.createElement("button");b.className="tab";b.id="lo";b.textContent="Выйти";b.onclick=()=>{try{localStorage.removeItem("jr_pw")}catch(e){}location.reload()};t.appendChild(b)}({add:renderAdd,list:renderList,stats:renderStats,codes:renderCodes})[view]()}
function renderAdd(){V.innerHTML=`<section class="view"><div class="hero"><div class="kicker">журнал · <b>${results.length}</b> результатов</div><h1>Вставь <span class="grad">результат</span></h1><p class="lead">Скопируй сообщение, которое прислал ученик (целиком или только код RES-…), и вставь сюда.</p></div>
 <div class="panel" style="display:grid;gap:12px"><textarea id="inp" rows="5" placeholder="Вставь сообщение ученика"></textarea><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" id="chk">Разобрать</button><span id="err" style="color:var(--err)"></span></div></div><div id="prev"></div></section>`;
 V.querySelector("#chk").onclick=()=>{try{parsed=parse(V.querySelector("#inp").value);V.querySelector("#err").textContent="";showPrev()}catch(e){parsed=null;V.querySelector("#err").textContent=e.message||"Не получилось разобрать код";V.querySelector("#prev").innerHTML=""}}}
function itemsHTML(items){return `<div class="rlist">${items.map((it,i)=>{const m=MAP[it.id]||["?",0,"","задача не найдена"];return `<div class="ri ${it.ok?"ok":"no"}"><span class="mk">${it.ok?"✓":"✗"}</span><div><span class="tn">${i+1}.</span>${esc(m[3])}…<div class="tr" style="margin-top:6px"><span class="num t2">ответ ученика: ${esc(it.given||"—")}</span>${it.ok?"":`<span class="num" style="color:var(--ok)">верно: ${esc(m[2])}</span>`}${m[1]?`<a href="https://3.shkolkovo.online/catalog/${m[1]}/${it.id}" target="_blank" rel="noopener">Задача ↗</a>`:""}</div></div><span class="muted num">${m[0]==="X"?"Б":"У"+m[0]}</span></div>`}).join("")}</div>`}
function showPrev(){const p=parsed;const dup=results.some(r=>r.code===p.code);
 V.querySelector("#prev").innerHTML=`<div class="panel" style="margin-top:14px;display:grid;gap:10px"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline"><div><div class="h2" style="font-size:20px">${esc(p.name||"Без имени")} · ${esc(p.title)}</div><div class="t2 num">${new Date(p.start).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})} · ${p.kind==="hw"?"домашка":"тест"} · время ${fmtTime(p.dur)}</div></div><div class="grade" style="color:${color(p.score/p.n)}">${p.score}/${p.n}</div></div>
 ${itemsHTML(p.items)}<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button class="btn primary" id="save" ${dup||!db?"disabled":""}>Сохранить в журнал</button>${dup?`<span class="t2">Этот результат уже сохранён.</span>`:""}${!db?`<span class="t2">Хранилище браузера недоступно.</span>`:""}</div></div>`;
 const s=V.querySelector("#save");if(s)s.onclick=async()=>{s.disabled=true;try{await db.collection("results").add({code:p.code,name:p.name,kind:p.kind,title:p.title,start:p.start,dur:p.dur,score:p.score,n:p.n,items:p.items,savedAt:Date.now()});toast("Сохранено");parsed=null;view="list";document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.v==="list"));render()}catch(e){s.disabled=false;toast(e.code==="quota_exceeded"?"База заполнена — удали старые результаты":"Не удалось сохранить, попробуй ещё раз")}}}
function names(){return [...new Set(results.map(r=>r.name||"Без имени"))]}
function filtered(){return results.filter(r=>!filterName||(r.name||"Без имени")===filterName)}
function nameChips(){const ns=names();if(ns.length<2)return "";return `<div class="lessonpick" style="margin:6px 0 12px"><button class="chip" data-n="" aria-pressed="${!filterName}">Все ученики</button>${ns.map(n=>`<button class="chip" data-n="${esc(n)}" aria-pressed="${filterName===n}">${esc(n)}</button>`).join("")}</div>`}
function bindChips(){V.querySelectorAll("[data-n]").forEach(c=>c.onclick=()=>{filterName=c.dataset.n;render()})}
function renderList(){const rs=filtered();
 V.innerHTML=`<section class="view"><div class="hero"><div class="kicker">журнал · <b>${rs.length}</b> записей</div><h1>Результаты</h1></div>${nameChips()}
 ${rs.length?`<div class="panel tablewrap"><table><thead><tr><th>Дата</th><th>Ученик</th><th>Что</th><th>Итог</th><th>Время</th><th></th></tr></thead><tbody>${rs.map(r=>`<tr data-id="${r.id}"><td class="num">${new Date(r.start).toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit"})}</td><td>${esc(r.name||"Без имени")}</td><td>${r.kind==="hw"?"ДЗ":"Тест"} · ${esc(r.title)}</td><td class="num" style="color:${color(r.score/r.n)};font-weight:700">${r.score}/${r.n}</td><td class="num t2">${fmtTime(r.dur)}</td><td><button class="linkbtn" data-open="${r.id}">разбор</button> · <button class="linkbtn" data-del="${r.id}">удалить</button></td></tr>`).join("")}</tbody></table></div><div id="detail"></div>`:`<div class="panel t2">Пока пусто — добавь первый результат ученика.</div>`}<div class="panel" style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center"><span class="t2">Результаты хранятся в этом браузере. Делай резервную копию:</span><button class="btn small" id="exp">Скачать копию</button><label class="btn small ghost" for="imp">Загрузить копию</label><input type="file" id="imp" accept=".json" hidden></div></section>`;
 bindChips();
 V.querySelector("#exp").onclick=()=>{const b=new Blob([JSON.stringify(db.load())],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="zhurnal-rezultaty-"+new Date().toISOString().slice(0,10)+".json";a.click()};
 V.querySelector("#imp").onchange=async e=>{try{const arr=JSON.parse(await e.target.files[0].text());const cur=db.load();const have=new Set(cur.map(x=>x.code));arr.forEach(x=>{if(x&&x.code&&!have.has(x.code))cur.push(x)});db.save(cur);db.refresh();toast("Копия загружена")}catch(err){toast("Не получилось прочитать файл")}};
 V.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{const r=results.find(x=>x.id===b.dataset.open);V.querySelector("#detail").innerHTML=`<div class="panel" style="margin-top:14px"><div class="h2" style="font-size:18px">${esc(r.name||"Без имени")} · ${esc(r.title)} — ${r.score}/${r.n}</div>${itemsHTML(r.items||[])}</div>`;V.querySelector("#detail").scrollIntoView({behavior:"smooth"})});
 V.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(!b.dataset.sure){b.dataset.sure=1;b.textContent="точно?";return}try{await db.doc("results/"+b.dataset.del).delete();toast("Удалено")}catch(e){toast("Не удалось удалить")}})}
function renderStats(){const rs=filtered();const per={};const wrong={};let tot=0,ok=0;
 rs.forEach(r=>(r.items||[]).forEach(it=>{const m=MAP[it.id];const l=m?m[0]:"?";per[l]=per[l]||[0,0];per[l][0]++;tot++;if(it.ok){per[l][1]++;ok++}else{wrong[it.id]=(wrong[it.id]||0)+1}}));
 const ls=Object.keys(LN).filter(l=>per[l]);const worst=Object.entries(wrong).sort((a,b)=>b[1]-a[1]).slice(0,12);
 const trend=[...rs].sort((a,b)=>a.start-b.start).slice(-12);
 V.innerHTML=`<section class="view"><div class="hero"><div class="kicker">статистика · <b>${rs.length}</b> работ</div><h1>Как идут <span class="grad">дела</span></h1>${nameChips()}
 <div class="stats"><span class="stat"><b>${tot}</b>задач решено</span><span class="stat"><b>${tot?Math.round(ok/tot*100):0}%</b>точность</span><span class="stat"><b>${rs.length?Math.round(rs.reduce((a,r)=>a+r.score/r.n,0)/rs.length*100):0}%</b>средний балл за работу</span></div></div>
 ${tot?`<div class="grid2"><div class="panel"><div class="h2" style="font-size:18px;margin-bottom:8px">Точность по урокам</div>${ls.map(l=>{const [n,c]=per[l];const p=c/n;return `<div class="prow"><span>${l==="X"?"Бонус":"У"+l} · ${LN[l]}</span><div class="meter"><i style="width:${p*100}%;background:${color(p)}"></i></div><span class="num" style="text-align:right;color:${color(p)}">${Math.round(p*100)}%</span></div>`}).join("")}<p class="t2" style="font-size:13px;margin:10px 0 0">Красное и жёлтое — темы для повторения на разминке.</p></div>
 <div class="panel"><div class="h2" style="font-size:18px;margin-bottom:8px">Динамика (последние работы)</div><div style="display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:10px">${trend.map(r=>{const p=r.score/r.n;return `<div title="${esc(r.title)}: ${r.score}/${r.n}" style="flex:1;display:grid;justify-items:center;gap:4px"><span class="num" style="font-size:10.5px;color:${color(p)}">${Math.round(p*100)}</span><div style="width:100%;max-width:34px;height:${Math.max(4,p*100)}px;border-radius:6px 6px 2px 2px;background:${color(p)};box-shadow:0 0 12px ${color(p)}"></div><span class="num muted" style="font-size:10px">${new Date(r.start).toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit"})}</span></div>`}).join("")}</div></div></div>
 <div class="panel" style="margin-top:14px"><div class="h2" style="font-size:18px;margin-bottom:8px">Чаще всего ошибается</div>${worst.length?`<div class="rlist">${worst.map(([id,c])=>{const m=MAP[id]||["?",0,"",""];return `<div class="ri no"><span class="mk">${c}×</span><div>${esc(m[3])}…<div class="tr" style="margin-top:6px"><span class="num" style="color:var(--ok)">ответ: ${esc(m[2])}</span>${m[1]?`<a href="https://3.shkolkovo.online/catalog/${m[1]}/${id}" target="_blank" rel="noopener">Задача ↗</a>`:""}</div></div><span class="muted num">${m[0]==="X"?"Б":"У"+m[0]}</span></div>`}).join("")}</div>`:`<p class="t2">Ошибок нет — отлично!</p>`}</div>`:`<div class="panel t2">Статистика появится после первого сохранённого результата.</div>`}</section>`;
 bindChips()}
render();
db=(()=>{const K="jr_results";const load=()=>{try{return JSON.parse(localStorage.getItem(K)||"[]")}catch(e){return []}};const save=a=>{localStorage.setItem(K,JSON.stringify(a))};
 const refresh=()=>{results=load().sort((x,y)=>y.start-x.start);if(view!=="add")render();else{const k=V.querySelector(".kicker b");if(k)k.textContent=results.length}};
 return {collection:()=>({add:async o=>{const a=load();a.push({...o,id:Date.now().toString(36)+Math.random().toString(36).slice(2,6)});save(a);refresh()}}),doc:p=>({delete:async()=>{const id=p.split("/")[1];save(load().filter(x=>x.id!==id));refresh()}}),refresh,load,save}})();
db.refresh();render();

}
</script>
</body></html>
